# Köprü - Windows istemcisi derlemesi.
# RustDesk'in flutter-build.yml dosyasindaki Windows x64 isinin sadelestirilmis kopyasi
# (imzalama, arm64, MSI ve guncelleme metadata adimlari cikarildi; marka adimi eklendi).
name: Kopru Windows Build

on:
  workflow_dispatch:
    inputs:
      sunucu:
        description: "Kendi sunucun, ornek: uzak.alanadin.com (bos = gomulu sunucu yok)"
        default: ""
      anahtar:
        description: "Sunucu anahtari (id_ed25519.pub icerigi)"
        default: ""
  push:
    branches: [main]
    paths: ["marka/**", ".github/workflows/kopru-build.yml"]

permissions:
  contents: write

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  PYTHONUTF8: "1"
  MARKA_AD: "Kopru"
  MARKA_GORUNEN: "Köprü"
  MARKA_DEPO: ${{ github.server_url }}/${{ github.repository }}
  # Sunucu: elle baslatmada girilen deger, yoksa depo degiskenleri (Settings > Variables)
  MARKA_SUNUCU: ${{ inputs.sunucu || vars.MARKA_SUNUCU || '' }}
  MARKA_ANAHTAR: ${{ inputs.anahtar || vars.MARKA_ANAHTAR || '' }}

jobs:
  # Marka betigini hizlica dener; bir kalip bulunamazsa 1 dakikada hata verir.
  marka-kontrol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Marka uygula (deneme)
        run: python3 marka/marka-uygula.py --ad "$MARKA_AD" --gorunen-ad "$MARKA_GORUNEN" --depo "$MARKA_DEPO" --sunucu "$MARKA_SUNUCU" --anahtar "$MARKA_ANAHTAR"
      - name: Kalan RustDesk izleri (bilgi)
        run: |
          grep -rn "rustdesk\.com" flutter/lib/desktop flutter/lib/common.dart || true

  generate-bridge:
    needs: [marka-kontrol]
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    needs: [marka-kontrol]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Kopru x86_64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Marka uygula
        shell: pwsh
        run: python marka/marka-uygula.py --ad "$env:MARKA_AD" --gorunen-ad "$env:MARKA_GORUNEN" --depo "$env:MARKA_DEPO" --sunucu "$env:MARKA_SUNUCU" --anahtar "$env:MARKA_ANAHTAR"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # Gorev Yoneticisi'nde "Kopru.exe" gorunsun
          Rename-Item ./rustdesk/rustdesk.exe "$env:MARKA_AD.exe"

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${MARKA_AD}.exe"
          popd
          mkdir -p ./cikti
          mv ./target/release/rustdesk-portable-packer.exe "./cikti/${MARKA_AD}.exe"
          ls -l ./cikti

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.MARKA_AD }}-windows-x86_64
          path: ./cikti
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: false
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: ${{ env.MARKA_GORUNEN }} ${{ env.VERSION }} (derleme ${{ github.run_number }})
          body: |
            Windows için ${{ env.MARKA_GORUNEN }} uzak masaüstü programı.
            İndir: ${{ env.MARKA_DEPO }}/releases/latest/download/${{ env.MARKA_AD }}.exe
          files: ./cikti/*.exe
